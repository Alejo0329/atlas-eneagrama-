    <script>
      (function () {
        var isMetaMaskNoise = function (msg, stack, file) {
          var s = String(msg || '') + ' ' + String(stack || '') + ' ' + String(file || '');
          return (
            s.indexOf('chrome-extension://nkbihfbeogaeaoehlefnkodbefgpgknn') !== -1 ||
            s.indexOf('Failed to connect to MetaMask') !== -1
          );
        };
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var r = e.reason;
            if (isMetaMaskNoise(r && r.message ? r.message : r, r && r.stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'error',
          function (e) {
            var err = e.error;
            if (
              isMetaMaskNoise(
                err && err.message ? err.message : e.message,
                err && err.stack,
                e.filename
              )
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );

        if ('caches' in window) {
          caches.keys().then(function (keys) {
            var legacy = keys.filter(function (k) {
              return k === 'atlas-eneagrama-v1' || k === 'atlas-eneagrama-v2';
            });
            if (legacy.length > 0) {
              return Promise.all(
                legacy.map(function (k) {
                  return caches.delete(k);
                })
              )
                .then(function () {
                  if ('serviceWorker' in navigator) {
                    return navigator.serviceWorker.getRegistrations().then(function (regs) {
                      return Promise.all(
                        regs.map(function (reg) {
                          return reg.unregister();
                        })
                      );
                    });
                  }
                })
                .then(function () {
                  try {
                    if (!sessionStorage.getItem('atlas_sw_v3_cleaned')) {
                      sessionStorage.setItem('atlas_sw_v3_cleaned', '1');
                      window.location.reload();
                    }
                  } catch (_) {}
                });
            }
          });
        }
      })();
    </script>
